<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台 - BestAds Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../prototype-kit/admin-shell/admin-page.css">
  <style>
    .workbench-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .workbench-card { display: flex; align-items: center; gap: 16px; min-height: 122px; padding: 20px; }
    .workbench-card__icon { display: grid; width: 48px; height: 48px; flex: 0 0 48px; place-items: center; border-radius: 12px; background: var(--ops-muted-surface, #f5f5f5); color: var(--ops-foreground, #0a0a0a); font-size: 20px; }
    .workbench-card__label { margin: 0 0 8px; color: var(--ops-secondary, #595959); font-size: 14px; line-height: 20px; }
    .workbench-card__value { margin: 0; color: var(--ops-foreground, #0a0a0a); font-size: 28px; font-weight: 700; line-height: 34px; }
    .workbench-card__meta { margin-top: 8px; color: var(--ops-secondary, #595959); font-size: 13px; line-height: 20px; }
    .workbench-section { margin-top: 16px; }
    .workbench-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .workbench-action { display: flex; align-items: center; justify-content: space-between; min-height: 72px; padding: 16px; color: inherit; text-decoration: none; }
    .workbench-action:hover { background: var(--ops-muted-surface, #f5f5f5); }
    .workbench-action strong { display: block; color: var(--ops-foreground, #0a0a0a); font-size: 15px; line-height: 22px; }
    .workbench-action span { display: block; margin-top: 2px; color: var(--ops-secondary, #595959); font-size: 13px; line-height: 20px; }
    .workbench-list { margin: 0; padding: 0; list-style: none; }
    .workbench-list li { display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-bottom: 1px solid var(--ops-divider, rgba(0,0,0,.06)); }
    .workbench-list li:last-child { border-bottom: 0; }
    .workbench-list strong { color: var(--ops-foreground, #0a0a0a); font-size: 14px; font-weight: 500; }
    .workbench-list span { color: var(--ops-secondary, #595959); font-size: 13px; }
    @media (max-width: 1360px) {
      .workbench-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body class="admin-prototype-page" data-figma-ops="true" data-admin-page="workbench">
  <div class="admin-frame">
    <aside id="sidebar"><div></div></aside>
    <section class="admin-content">
      <header data-admin-shell="header">
        <div class="admin-shell-generated-header-row">
          <div class="admin-shell-generated-breadcrumb"><span>主页</span><i class="fas fa-chevron-right" aria-hidden="true"></i><strong>工作台</strong></div>
          <div class="admin-shell-generated-actions"><button type="button" id="themeToggleButton" class="admin-shell-theme-toggle" aria-label="切换深色模式" title="切换深色模式"><i class="fas fa-moon" aria-hidden="true"></i></button><div class="admin-shell-generated-user"><span class="admin-shell-generated-avatar">A</span><span>管理员</span></div></div>
        </div>
      </header>
      <main class="admin-page-root">
        <div class="admin-page">
          <section class="workbench-grid" aria-label="运营概览">
            <article class="admin-card workbench-card">
              <div class="workbench-card__icon"><i class="fas fa-users" aria-hidden="true"></i></div>
              <div>
                <p class="workbench-card__label">客户数量</p>
                <p class="workbench-card__value">1,247</p>
                <div class="workbench-card__meta"><span class="status-tag status-success">+12% 本月</span></div>
              </div>
            </article>
            <article class="admin-card workbench-card">
              <div class="workbench-card__icon"><i class="fas fa-list" aria-hidden="true"></i></div>
              <div>
                <p class="workbench-card__label">管理账户</p>
                <p class="workbench-card__value">3,456</p>
                <div class="workbench-card__meta"><span class="status-tag status-success">+8% 本月</span></div>
              </div>
            </article>
            <article class="admin-card workbench-card">
              <div class="workbench-card__icon"><i class="fas fa-clock" aria-hidden="true"></i></div>
              <div>
                <p class="workbench-card__label">待处理事项</p>
                <p class="workbench-card__value">23</p>
                <div class="workbench-card__meta"><span class="status-tag status-warning">待跟进</span></div>
              </div>
            </article>
            <article class="admin-card workbench-card">
              <div class="workbench-card__icon"><i class="fas fa-dollar-sign" aria-hidden="true"></i></div>
              <div>
                <p class="workbench-card__label">月度营收</p>
                <p class="workbench-card__value">$45.2K</p>
                <div class="workbench-card__meta"><span class="status-tag status-success">+15% 本月</span></div>
              </div>
            </article>
          </section>

          <section class="admin-card workbench-section">
            <div class="admin-card__header">
              <h2 class="admin-card__title">常用操作</h2>
            </div>
            <div class="admin-card__body">
              <div class="workbench-actions">
                <a class="admin-card workbench-action" href="customer-management.html"><div><strong>客户管理</strong><span>查看客户资料、权限、余额和跟进信息</span></div><i class="fas fa-chevron-right" aria-hidden="true"></i></a>
                <a class="admin-card workbench-action" href="customer-sub-account-management.html"><div><strong>客户子账号管理</strong><span>维护客户角色、子账号和密码重置</span></div><i class="fas fa-chevron-right" aria-hidden="true"></i></a>
                <a class="admin-card workbench-action" href="deduction-details.html"><div><strong>其他扣费</strong><span>处理地区税费预收、释放和回退</span></div><i class="fas fa-chevron-right" aria-hidden="true"></i></a>
                <a class="admin-card workbench-action" href="export-center.html"><div><strong>导出中心</strong><span>查看导出任务状态并下载文件</span></div><i class="fas fa-chevron-right" aria-hidden="true"></i></a>
              </div>
            </div>
          </section>

          <section class="admin-card workbench-section">
            <div class="admin-card__header">
              <h2 class="admin-card__title">待处理事项</h2>
              <span class="muted">测试环境样例</span>
            </div>
            <ul class="workbench-list">
              <li><strong>处理开户申请</strong><span>3 条待审核</span></li>
              <li><strong>账户充值</strong><span>5 条待处理</span></li>
              <li><strong>绑卡户数据核对</strong><span>2 条异常待确认</span></li>
              <li><strong>在线支付白名单</strong><span>1 条配置待检查</span></li>
            </ul>
          </section>
        </div>
      </main>
    </section>
  </div>
  <script src="../../prototype-kit/admin-shell/admin-shell.js"></script>
</body>
</html>
